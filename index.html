<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karnaugh Map Builder and Solver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Karnaugh Map Builder and Solver</h1>
    </header>

    <main class="center-wrapper">
      <div class="main-content">
        <!-- Top row with variables, kmap, and expression -->
        <div class="top-row">
          <!-- Variable Selection Section -->
          <div class="variable-selection well">
            <h2>Select Variables</h2>
            <div class="variable-options">
              <label for="TwoVariableRB" class="variable-option">
                <input type="radio" onClick="ChangeVariableNumber(2)" id="TwoVariableRB" name="variables" />
                Two
              </label>
              <label for="ThreeVariableRB" class="variable-option">
                <input type="radio" onClick="ChangeVariableNumber(3)" id="ThreeVariableRB" name="variables" />
                Three
              </label>
              <label for="FourVariableRB" class="variable-option">
                <input type="radio" onClick="ChangeVariableNumber(4)" id="FourVariableRB" name="variables" />
                Four
              </label>
            </div>
          </div>

          <!-- Karnaugh Map Section -->
          <section class="kmap-section well">
            <h2>Karnaugh Map</h2>
            <div id="KarnoMapDiv"></div>
          </section>

          <!-- Expression Input -->
          <div class="expression-input well">
            <h2>Expression</h2>
            <p class="instruction-text">Use ' for NOT and + for OR</p>
            <input type="text" class="equation-input" id="equation" style="text-transform: uppercase" />
          </div>
        </div>

        <!-- Circuit Section -->
        <section class="circuit-section well">
            <div id="EquationDiv"></div>
            <div class="circuit-controls">
                <button id="generateCircuit" class="circuit-button">Generate Circuit</button>
                <button id="zoomIn" class="circuit-button zoom-button">+</button>
                <button id="zoomOut" class="circuit-button zoom-button">-</button>
            </div>
            <canvas id="circuitCanvas"></canvas> <!-- Removed width and height attributes -->
        </section>

        <!-- Truth Table Section -->
        <section class="truth-table-section">
          <div class="container results">
            <div class="result-column">
              <h2>Truth Table</h2>
              <div id="TruthTableDiv"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
    <script src="equation.js"></script>
  </body>
</html>
